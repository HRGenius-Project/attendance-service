
server:
  port: 8093

spring:
  application:
    name: attendance-service

  datasource:
    url: jdbc:mysql://localhost:3307/hrgenius_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root@12345}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hrgenius}
    password: ${RABBITMQ_PASSWORD:Rabbit@12345}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  rabbitmq:
    exchange: hrgenius.exchange
    queue: attendance.queue
    routing-key-in: attendance.punch.in
    routing-key-out: attendance.punch.out
    leave-queue: attendance.leave.queue
    routing-key-leave: leave.approved